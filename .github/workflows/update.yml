name: Update Timestamp DB
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: timestamp-db-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build latest database
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: python scripts/update.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add movie tv .cache
          git diff --cached --quiet && exit 0
          git commit -m "Update timestamp database"
          git push
